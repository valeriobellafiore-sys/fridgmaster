name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer
      - name: Build with Buildozer
        run: |
          # Aggiungiamo il path per trovare l'eseguibile
          export PATH=$PATH:~/.local/bin
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Tentativo di build con il flag di debug forzato
          yes | buildozer --verbose android debug
